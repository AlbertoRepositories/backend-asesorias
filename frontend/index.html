<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Sistema de Asesorías</title>

<!-- Bootstrap 4 -->
<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">

<!-- FontAwesome -->
<link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.3.1/css/all.css">

<!-- Google Font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link 
  href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" 
  rel="stylesheet"
>

<style>

html, body {
  height: 100%;
  margin: 0;
  font-family: 'Poppins', sans-serif;
  color: #f1f5f9;
  background: 
    linear-gradient(rgba(15, 23, 42, 0.85), rgba(15, 23, 42, 0.85)),
    url('https://images.pexels.com/photos/7972336/pexels-photo-7972336.jpeg') center/cover no-repeat;
}

.main-container {
  min-height: calc(100vh - 56px);
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  align-items: center;
  padding-top: 40px;
}

.carousel {
  max-width: 700px;
  margin-bottom: 20px;
}

.carousel-item img {
  height: 320px;
  object-fit: cover;
  border-radius: 16px;
}

.main-container h1, 
.main-container p, 
.main-container span {
  text-shadow: 2px 2px 6px rgba(0,0,0,0.6);
  font-weight: 600;
}

.card {
  width: 50%;
  background: var(--glass);
  backdrop-filter: blur(8px);
  border-radius: 18px;
  border: 1px solid rgba(255,255,255,0.2);
  box-shadow: var(--shadow);
}

.card-header h3 {
  color: #fbbf24;
}

.input-group-prepend span {
  background-color: #fbbf24;
  color: black;
}

.login_btn {
  background-color: #fbbf24;
  color: black;
  border: none;
  border-radius: 10px;
}

.login_btn:hover {
  background-color: #fde68a;
}

.btn-primary {
  background-color: var(--primary);
  border: none;
}

.btn-primary:hover {
  background-color: var(--primary-dark);
}

.btn-success {
  background-color: var(--success);
  border: none;
}

.btn-secondary {
  border-radius: 10px;
}

.modal-content {
  border-radius: 18px;
  box-shadow: var(--shadow);
}

@media (max-width: 768px) {
  .card {
    width: 90%;
  }
}
</style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container-fluid">
    <a class="navbar-brand text-white"><i class="fas fa-graduation-cap"></i> Asesorías</a>

    <div class="d-grid gap-2 d-md-flex justify-content-md-end"> 
      <button class="btn btn-secondary me-md-2" type="button" onclick="window.location.href='index.html'">
        <i class="fas fa-home"></i> Inicio
      </button>
    </div>
  </div>
</nav>

<!-- CONTENIDO PRINCIPAL -->
<div class="main-container text-center text-white">

  <!-- CARRUSEL -->
  <div id="carouselExample" class="carousel slide w-100" data-ride="carousel">
    <div class="carousel-inner rounded">

      <div class="carousel-item active">
        <img class="d-block w-100" src="https://img.freepik.com/free-photo/happy-students-sitting-studying-outdoors-while-talking_171337-13401.jpg?semt=ais_incoming&w=740&q=80">
      </div>

      <div class="carousel-item">
        <img class="d-block w-100" src="https://static.vecteezy.com/system/resources/thumbnails/001/269/528/small/young-collage-student-using-computer-to-study-online.jpg">
      </div>

      <div class="carousel-item">
        <img class="d-block w-100" src="https://www.iteso.mx/documents/866203/1731326/IMG_AsAc01aqui2.jpg/89d98917-ea6a-340a-7db1-637a30e31d0c">
      </div>

    </div>

    <a class="carousel-control-prev" href="#carouselExample" role="button" data-slide="prev">
      <span class="carousel-control-prev-icon"></span>
    </a>

    <a class="carousel-control-next" href="#carouselExample" role="button" data-slide="next">
      <span class="carousel-control-next-icon"></span>
    </a>
  </div>

  <!-- BIENVENIDA -->
  <h1>Bienvenido al Sistema de Asesorías</h1>
  <p>Encuentra asesorías fácilmente o comparte tu conocimiento</p>

  <!-- CARD LOGIN -->
  <div class="card mt-4">
    <div class="card-header">
      <h3><i class="fas fa-sign-in-alt"></i> Inicia Sesión</h3>
    </div>

    <div class="card-body">
      <form id="loginForm">

        <div class="input-group form-group">
          <div class="input-group-prepend">
            <span class="input-group-text"><i class="fas fa-user"></i></span>
          </div>
          <input type="email" class="form-control" id="loginEmail" placeholder="Correo" required>
        </div>

        <div class="input-group form-group">
          <div class="input-group-prepend">
            <span class="input-group-text"><i class="fas fa-key"></i></span>
          </div>
          <input type="password" class="form-control" id="loginPassword" placeholder="Contraseña" required>
        </div>

        <div class="form-group">
          <input type="submit" value="Iniciar Sesión" class="btn float-right login_btn">
          <div class="mt-2">
            <span>¿Sin cuenta?</span>
            <button type="button" class="btn btn-primary" data-toggle="modal" data-target="#registerModal">
              ¡Regístrate ahora!
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL REGISTRO -->
  <div class="modal fade" id="registerModal">
    <div class="modal-dialog">
      <div class="modal-content bg-primary p-4">
        <div class="modal-header">
          <h1 class="modal-title text-black">Registro de nuevo usuario</h1> 
        </div>

        <form id="registerForm">
          <input class="form-control mb-2" id="regNombre" placeholder="Nombre de usuario" required minlength="3">
          <input type="email" class="form-control mb-2" id="regEmail" placeholder="Correo" required>

          <select class="form-control mb-2" id="regTipo" required>
            <option value="">Selecciona tu rol, por favor</option>
            <option value="asesorado">Asesorado</option>
            <option value="asesor">Asesor</option>
          </select>

          <input type="password" class="form-control mb-2" id="regPassword" placeholder="Contraseña" required
            pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{7,}"
            title="Minimo 7 caracteres, una mayuscula, una minuscula y un numero">

          <input type="password" class="form-control mb-2" id="regConfirm" placeholder="Confirma la contraseña" required
            pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{7,}"
            title="Recuerda las especificaciones minimas para tu contraseña">

          <div class="d-flex justify-content-center">
            <button type="button" class="btn btn-danger m-1" data-dismiss="modal">Cancelar</button>
            <button class="btn btn-success m-1" type="submit">¡Registrame ahora!</button>
          </div>
        </form>
      </div>
    </div>
  </div>

</div>

<!-- SCRIPTS DE TERCEROS -->
<script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/js/bootstrap.min.js"></script>

<!-- SCRIPTS PROPIOS - Orden importante: config, session, api, main -->
<script src="js/config.js"></script>
<script src="js/sessionManager.js"></script>
<script src="js/api.js"></script>
<script src="js/main.js"></script>

<!-- LOGICA DE LOGIN Y REGISTRO -->
<script>
document.addEventListener('DOMContentLoaded', function() {
  const loginForm = document.getElementById('loginForm');
  const registerForm = document.getElementById('registerForm');

  // MANEJO DEL FORMULARIO DE LOGIN
  if (loginForm) {
    loginForm.addEventListener('submit', async function(e) {
      e.preventDefault();

      const correo = document.getElementById('loginEmail').value.trim();
      const contraseña = document.getElementById('loginPassword').value;

      const btnSubmit = loginForm.querySelector('[type="submit"]');
      btnSubmit.disabled = true;
      btnSubmit.value = 'Iniciando...';

      try {
        const respuesta = await apiManager.login(correo, contraseña);

        if (respuesta.success) {
          // Guardar datos del usuario (NO guardamos token porque va en cookies)
          sessionManager.saveSession(respuesta.data.usuario);

          // Redirigir segun el tipo de usuario
          const tipo = respuesta.data.usuario.tipo_usuario;
          if (tipo === 'asesor') {
            window.location.href = 'dashboard.html';
          } else {
            window.location.href = 'dashboard.html';
          }
        }
      } catch (error) {
        let mensaje = 'Error desconocido';
        
        if (error.message.includes('401')) {
          mensaje = 'Correo o contraseña incorrectos';
        } else if (error.message.includes('500')) {
          mensaje = 'Error del servidor. Intenta más tarde.';
        } else {
          mensaje = 'Error al conectar con el servidor';
        }
        
        alert(mensaje);
        btnSubmit.disabled = false;
        btnSubmit.value = 'Iniciar Sesión';
      }
    });
  }

  // MANEJO DEL FORMULARIO DE REGISTRO
  if (registerForm) {
    registerForm.addEventListener('submit', async function(e) {
      e.preventDefault();

      const nombre_usuario = document.getElementById('regNombre').value.trim();
      const correo = document.getElementById('regEmail').value.trim();
      const tipo_usuario = document.getElementById('regTipo').value;
      const contraseña = document.getElementById('regPassword').value;
      const confirmar = document.getElementById('regConfirm').value;

      // Validaciones basicas del lado del cliente
      if (!tipo_usuario) {
        alert('Por favor selecciona el tipo de usuario');
        return;
      }

      if (contraseña !== confirmar) {
        alert('Las contraseñas no coinciden');
        return;
      }

      const btnReg = registerForm.querySelector('[type="submit"]');
      btnReg.disabled = true;
      btnReg.textContent = 'Registrando...';

      try {
        const respuesta = await apiManager.register({
          nombre_usuario,
          correo,
          contraseña,
          tipo_usuario
        });

        if (respuesta.success) {
          alert('¡Registro exitoso! Ahora inicia sesión.');
          // Cerrar el modal de registro
          $('#registerModal').modal('hide');
          // Limpiar el formulario
          registerForm.reset();
          // Enfocar el campo de correo del login
          document.getElementById('loginEmail').focus();
        }
      } catch (error) {
        let mensaje = 'Error en el registro';
        
        if (error.message.includes('409')) {
          mensaje = 'El correo ya está registrado';
        } else if (error.message.includes('400')) {
          mensaje = 'Los datos ingresados no son válidos';
        } else {
          mensaje = 'Error al registrarse: ' + error.message;
        }
        
        alert(mensaje);
        btnReg.disabled = false;
        btnReg.textContent = '¡Registrame ahora!';
      }
    });
  }
});
</script>

</body>
</html>
