<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Perfil</title>

  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.3.1/css/all.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous"/>

  <!-- Common CSS - Estilos compartidos -->
  <link rel="stylesheet" href="css/common.css">

  <style>
    body {
      min-height: 100vh;
    }

    /* ── TARJETA PERFIL ─────────────────────────── */
    .profile-card {
      background: linear-gradient(145deg, rgba(37,99,235,0.2), rgba(14,165,233,0.12));
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 24px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.35);
      backdrop-filter: blur(12px);
      overflow: hidden;
    }

    .profile-banner {
      height: 90px;
      position: relative;
    }
    /* Color del banner según tipo de usuario */
    .profile-banner.asesor    { background: linear-gradient(135deg, #1d4ed8, #38bdf8); }
    .profile-banner.asesorado { background: linear-gradient(135deg, #16a34a, #34d399); }
    .profile-banner.unknown   { background: linear-gradient(135deg, #6d28d9, #a78bfa); }

    .profile-avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      border: 4px solid #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      font-weight: 700;
      color: white;
      position: absolute;
      bottom: -45px;
      left: 50%;
      transform: translateX(-50%);
      box-shadow: 0 4px 14px rgba(0,0,0,0.4);
    }
    .profile-avatar.asesor    { background: linear-gradient(135deg, #1d4ed8, #38bdf8); }
    .profile-avatar.asesorado { background: linear-gradient(135deg, #16a34a, #34d399); }
    .profile-avatar.unknown   { background: linear-gradient(135deg, #6d28d9, #a78bfa); }

    .profile-body { padding: 60px 24px 28px; text-align: center; }

    .profile-name {
      font-size: 1.5rem;
      font-weight: 700;
      color: #f8fafc;
      margin-bottom: 4px;
    }

    .profile-role-badge {
      display: inline-block;
      border-radius: 999px;
      padding: 2px 14px;
      font-size: 0.78rem;
      font-weight: 600;
      margin-bottom: 14px;
    }
    .profile-role-badge.asesor    { background: rgba(37,99,235,0.3);  color: #93c5fd; border: 1px solid rgba(147,197,253,0.3); }
    .profile-role-badge.asesorado { background: rgba(22,163,74,0.3);   color: #6ee7b7; border: 1px solid rgba(110,231,183,0.3); }

    .profile-rating     { font-size: 1.6rem; letter-spacing: 2px; margin-bottom: 2px; }
    .profile-rating-num { font-size: 0.85rem; color: #94a3b8; }

    .profile-stat {
      background: rgba(255,255,255,0.06);
      border-radius: 14px;
      padding: 12px 8px;
      text-align: center;
      flex: 1;
    }
    .stat-num   { font-size: 1.4rem; font-weight: 700; color: #38bdf8; }
    .stat-label { font-size: 0.7rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }

    /* Botones de acción del perfil */
    .action-btn {
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.85rem;
      padding: 8px 14px;
      border: none;
      transition: opacity .2s, transform .15s;
    }
    .action-btn:hover { opacity: 0.88; transform: translateY(-1px); }

    /* ── SECCIONES ─────────────────────────────── */
    .section-card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.2);
    }

    .section-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: #93c5fd;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 16px;
    }

    .asesoria-item {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: background .2s;
    }
    .asesoria-item:hover { background: rgba(255,255,255,0.09); }

    .asesoria-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      flex-shrink: 0;
    }
    .asesoria-icon.asesor    { background: linear-gradient(135deg, #1d4ed8, #0ea5e9); }
    .asesoria-icon.asesorado { background: linear-gradient(135deg, #16a34a, #34d399); }

    .asesoria-text       { font-size: 0.85rem; color: #cbd5e1; line-height: 1.4; }
    .asesoria-text strong { color: #f1f5f9; }

    /* ── EVALUACIÓN ────────────────────────────── */
    .eval-card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 20px;
      padding: 28px;
    }

    .star {
      font-size: 36px;
      cursor: pointer;
      color: #475569;
      transition: transform .15s, color .15s;
    }
    .star:hover  { transform: scale(1.2); }
    .star.active { color: gold; }

    .eval-textarea {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.14);
      color: #e2e8f0;
      border-radius: 12px;
      resize: none;
    }
    .eval-textarea::placeholder { color: #64748b; }
    .eval-textarea:focus {
      background: rgba(255,255,255,0.1);
      border-color: #2563eb;
      color: #e2e8f0;
      box-shadow: 0 0 0 3px rgba(37,99,235,0.2);
    }

    .info-box {
      background: rgba(37,99,235,0.12);
      border: 1px solid rgba(147,197,253,0.25);
      border-radius: 14px;
      padding: 20px;
      color: #93c5fd;
      text-align: center;
      font-size: 0.9rem;
    }

    .btn-eval {
      background: linear-gradient(135deg, #2563eb, #0ea5e9);
      border: none;
      border-radius: 12px;
      color: white;
      font-weight: 600;
      padding: 12px;
      transition: opacity .2s, transform .15s;
    }
    .btn-eval:hover { opacity: 0.9; transform: translateY(-1px); color: white; }
  </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark">
  <div class="container-fluid">
    <a class="navbar-brand"><i class="fas fa-graduation-cap"></i> Asesorías</a>
    <ul class="navbar-nav ms-auto">
      <li class="nav-item">
        <a class="nav-link" href="buscador.html">Buscar <i class="fas fa-search"></i></a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="dashboard.html">Menú <i class="fas fa-bars"></i></a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="notificaciones.html">Notificaciones <i class="fas fa-bell"></i></a>
      </li>
    </ul>
  </div>
</nav>

<div class="container py-5" style="max-width: 960px;">
  <div class="row g-4">

    <!-- ── COLUMNA IZQUIERDA: PERFIL ── -->
    <div class="col-12 col-lg-4">
      <div class="profile-card">

        <!-- Banner de color (se cambia por JS según el rol) -->
        <div class="profile-banner unknown" id="profileBanner">
          <!-- Avatar con la inicial del nombre -->
          <div class="profile-avatar unknown" id="avatarInicial">?</div>
        </div>

        <div class="profile-body">
          <div class="profile-name"    id="nombrePerfil">Cargando...</div>
          <div class="profile-role-badge unknown" id="rolBadge">
            <i class="fas fa-user me-1"></i> Cargando
          </div>

          <!-- Calificación (visible solo para asesores) -->
          <div id="seccionCalificacion">
            <div class="profile-rating"     id="calificacionEstrellas">☆☆☆☆☆</div>
            <div class="profile-rating-num" id="calificacionNum">Sin calificaciones aún</div>
          </div>

          <!-- Estadísticas -->
          <div class="d-flex gap-2 mt-3">
            <div class="profile-stat">
              <div class="stat-num"   id="statPrincipal">—</div>
              <div class="stat-label" id="statLabel">Asesorías</div>
            </div>
            <div class="profile-stat" id="statSegundoBox">
              <div class="stat-num"   id="statSegundo">—</div>
              <div class="stat-label" id="statSegundoLabel">Evaluaciones</div>
            </div>
          </div>

          <!-- Botones de acción (cambian según contexto) -->
          <div class="mt-3 d-grid gap-2" id="botonesAccion">
            <!-- Se llenan dinámicamente por JS -->
          </div>
        </div>
      </div>
    </div>

    <!-- ── COLUMNA DERECHA ── -->
    <div class="col-12 col-lg-8">

      <!-- SECCIÓN PRINCIPAL (asesorías del asesor o inscripciones del asesorado) -->
      <div class="section-card mb-4">
        <div class="section-title" id="tituloSeccion">
          <i class="fas fa-list me-2"></i>Cargando...
        </div>
        <div id="listaPrincipal">
          <div class="text-center text-secondary py-3">
            <i class="fas fa-spinner fa-spin me-2"></i>Cargando...
          </div>
        </div>
      </div>

      <!-- SECCIÓN DE EVALUACIÓN (solo aparece cuando vemos el perfil de OTRO asesor) -->
      <!-- id="seccionEvaluacion" → el módulo la muestra/oculta según contexto -->
      <div id="seccionEvaluacion" style="display:none;">
        <div class="eval-card">
          <div class="section-title mb-3">
            <i class="fas fa-star me-2"></i>Evalúa al asesor
          </div>

          <div class="text-center mb-3">
            <span class="star" data-value="1">★</span>
            <span class="star" data-value="2">★</span>
            <span class="star" data-value="3">★</span>
            <span class="star" data-value="4">★</span>
            <span class="star" data-value="5">★</span>
          </div>

          <textarea class="form-control eval-textarea mb-3"
            id="comentario" rows="3" maxlength="634"
            placeholder="Escribe un comentario (opcional, máx. 634 caracteres)">
          </textarea>

          <button class="btn btn-eval w-100" onclick="enviarEvaluacion()">
            <i class="fas fa-paper-plane me-2"></i>Enviar evaluación
          </button>
        </div>
      </div>

      <!-- MENSAJE DE PERFIL PROPIO (solo cuando es tu propio perfil) -->
      <div id="seccionPropioMensaje" style="display:none;">
        <div class="info-box">
          <i class="fas fa-info-circle fa-2x mb-3 d-block" style="color:#38bdf8;"></i>
          <strong>Este es tu perfil</strong><br>
          <span style="color:#94a3b8;" id="mensajePropioTexto">
            Gestiona tus asesorías desde el menú principal.
          </span>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
  integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
  crossorigin="anonymous"></script>

<!-- Scripts: config → session → api → módulo -->
<script src="js/config.js"></script>
<script src="js/sessionManager.js"></script>
<script src="js/api.js"></script>
<script src="js/main.js"></script>
<script src="js/modules/evaluacionesModule.js"></script>

</body>
</html>
